name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit -p tsconfig.json

      - run: npm run lint

      # `npm test` builds first, then runs the node test suite — including the
      # GROUND CALL ingest contract, which no external service is needed for.
      - run: npm test
